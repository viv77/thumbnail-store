<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thumbnail Store</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
  }
  h1 {
    margin: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 20px;
  }
  .item {
    background: #222;
    padding: 10px;
    border-radius: 10px;
  }
  img {
    width: 100%;
    border-radius: 10px;
  }
  button {
    margin-top: 10px;
    padding: 8px 15px;
    background: #ffcc00;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>Available Thumbnails</h1>

<div class="grid">

  <div class="item">
    <img src="RK001.png">
    <button onclick="copyText('दिल टूट गया... आज दिल की सच्ची बातें')">Copy Title</button>
  </div>

  <div class="item">
    <img src="RK002.png">
    <button onclick="copyText('तुम बदल गए... क्या सच में ऐसा होता है')">Copy Title</button>
  </div>

  <div class="item">
    <img src="RK003.png">
    <button onclick="copyText('बस तुम ही हो... आज की दिल की बातें')">Copy Title</button>
  </div>

  <div class="item">
    <img src="RK004.png">
    <button onclick="copyText('आज फिर याद आई... कुछ यादें कभी नहीं जाती')">Copy Title</button>
  </div>

</div>

<script>
function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Title copied!");
}
</script>

</body>
</html>
