<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Thumbnail Store</title>
<style>
  body { background:#111; color:#fff; font-family:Arial; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; padding:20px; }
  .item { background:#222; padding:10px; border-radius:10px; }
  img { width:100%; border-radius:10px; cursor:pointer; }
  .msg {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#333;
    padding:10px 20px;
    border-radius:20px;
    display:none;
  }
</style>
</head>

<body>

<div style="background:#ffcc00; color:#000; padding:14px; border-radius:8px; margin:10px; line-height:1.2;">

  <div style="font-size:34px; font-weight:bold; text-align:left; margin-bottom:2px;">
    थंबनेल टैप करें
  </div>

  <div style="font-size:34px; font-weight:bold; margin-left:10px; margin-top:0;">
    → गैलरी से अपलोड करें
  </div>

  <div style="font-size:34px; font-weight:bold; margin-left:10px; margin-top:0;">
    → टाइटल भी पेस्ट करें
  </div>

</div>
  <div class="grid" id="grid"></div>

<div id="msg" class="msg">Copied & Downloaded</div>

<script>

// 👉 Only edit this list
const files = [
"RK001 - दिल टूट गया... आज दिल की सच्ची बातें.png",
"RK002 - तुम बदल गए... क्या सच में ऐसा होता है.png",
"RK003 - बस तुम ही हो... आज की दिल की बातें.png",
"RK004 - आज फिर याद आई... कुछ यादें कभी नहीं जाती.png"
];

const grid = document.getElementById("grid");
const msg = document.getElementById("msg");

files.forEach(file => {

  let title = file.split(" - ")[1].replace(".png","");

  let div = document.createElement("div");

  div.innerHTML = `
    <img src="${file}" onclick="handleClick('${file}', '${title}')">
    <p>${title}</p>
  `;

  grid.appendChild(div);
});

function handleClick(file, title) {

  // Copy title
  navigator.clipboard.writeText(title);

  // Download image
  const link = document.createElement('a');
  link.href = file;
  link.download = file;
  link.click();

  // Small message
  msg.style.display = "block";
  setTimeout(() => { msg.style.display = "none"; }, 1500);
}

</script>

</body>
</html>
