<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Thumbnail Store</title>
<style>
  body { background:#111; color:#fff; font-family:Arial; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; padding:20px; }
  img { width:100%; border-radius:10px; cursor:pointer; }
</style>
</head>

<body>

<h2>Available Thumbnails</h2>

<div class="grid" id="grid"></div>

<script>

// 👉 Just list your filenames here (ONLY this part you edit)
const files = [
"RK001 - दिल टूट गया... आज दिल की सच्ची बातें.png",
"RK002 - तुम बदल गए... क्या सच में ऐसा होता है.png",
"RK003 - बस तुम ही हो... आज की दिल की बातें.png",
"RK004 - आज फिर याद आई... कुछ यादें कभी नहीं जाती.png"
];

// 👉 System logic (no need to touch)
const grid = document.getElementById("grid");

files.forEach(file => {

  // Extract title after " - " and remove .png
  let title = file.split(" - ")[1].replace(".png","");

  let div = document.createElement("div");

  div.innerHTML = `
    <img src="${file}" onclick="copyTitle('${title}')">
    <p>${title}</p>
  `;

  grid.appendChild(div);
});

function copyTitle(text) {
  navigator.clipboard.writeText(text);
  alert("Title copied!");
}

</script>

</body>
</html>
